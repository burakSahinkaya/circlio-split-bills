<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Group on Circlio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0D1117 0%, #161B22 50%, #1C2333 100%);
            color: #E6EDF3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.6);
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(20px);
        }
        .icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #58A6FF, #8B5CF6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            color: #8B949E;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin: 6px;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover { transform: scale(1.03); opacity: 0.9; }
        .btn-primary {
            background: linear-gradient(135deg, #58A6FF, #8B5CF6);
            color: white;
        }
        .btn-secondary {
            background: rgba(48, 54, 61, 0.6);
            color: #E6EDF3;
            border: 1px solid rgba(48, 54, 61, 0.8);
        }
        .code {
            display: inline-block;
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.2);
            border-radius: 8px;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 3px;
            color: #58A6FF;
            margin-bottom: 24px;
        }
        .footer {
            margin-top: 24px;
            color: #484F58;
            font-size: 13px;
        }
    </style>
    <meta name="apple-itunes-app" content="app-id=6761620867">
    <script>
        // Redirect iOS users directly to the App Store
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
            window.location.href = 'https://apps.apple.com/us/app/circlio-split-bills/id6761620867';
        }

        // Try to extract invite code from URL and redirect to app
        const path = window.location.pathname;
        const match = path.match(/\/invite\/([A-Za-z0-9]+)/);
        if (match) {
            document.addEventListener('DOMContentLoaded', function() {
                const codeEl = document.getElementById('invite-code');
                if (codeEl) codeEl.textContent = match[1];
            });
        }
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">🔗</div>
        <h1>You're Invited!</h1>
        <p>Someone invited you to join a group on <strong>Circlio</strong> — the easiest way to split expenses with friends.</p>
        <div class="code" id="invite-code">LOADING...</div>
        <br><br>
        <p style="margin-bottom: 16px;">Open or download the app to join:</p>
        <div>
            <a href="https://apps.apple.com/us/app/circlio-split-bills/id6761620867" class="btn btn-primary">📱 App Store</a>
            <a href="#" class="btn btn-secondary">🤖 Google Play</a>
        </div>
        <p class="footer">Already have the app? The link should open it automatically.</p>
    </div>
</body>
</html>
